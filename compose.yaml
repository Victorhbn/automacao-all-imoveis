services:
  app:
    build:
      context: .
    image: all-disparos:local
    container_name: all-disparos
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_PATH: /app/data/disparos.db
      APP_API_KEY: ${APP_API_KEY:?Defina APP_API_KEY no ambiente ou no arquivo .env}
      SEND_INTERVAL_SECONDS: ${SEND_INTERVAL_SECONDS:-2}
    ports:
      - "127.0.0.1:${DISPAROS_PORT:-8000}:8000"
    volumes:
      - disparos_data:/app/data
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).close()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  disparos_data:
